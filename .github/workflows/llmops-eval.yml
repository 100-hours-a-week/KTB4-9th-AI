name: LLMOps Evaluation & Release

on:
  workflow_dispatch:
    inputs:
      track_type:
        description: "평가 유형 선택 (비학습 베이스 모델 vs 파인튜닝 학습 모델)"
        required: true
        type: choice
        options:
          - base_model
          - trained_model
      model_id:
        description: "평가 및 운영 배포할 모델 ID"
        required: true
        default: "Qwen/Qwen3.5-122B-A10B-FP8"
      prompt_version:
        description: "프롬프트 버전"
        required: false
        default: "generate_problem/v11"
      gpu_type:
        description: "추론에 사용할 GPU 기종 선택"
        required: false
        default: "H200"
        type: choice
        options:
          - H200
          - B200
          - 2xA100
          - A100
          - L4
          - L40S
      limit:
        description: "평가할 요청 건수 (0이면 72건 전체, 스모크 테스트 시 4건 등)"
        required: false
        default: "0"

permissions:
  contents: read
  id-token: write

concurrency:
  group: llmops-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run AI Evaluation on Modal Serverless
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LABEL: eval-${{ github.run_id }}
      MODAL_GPU_TYPE: ${{ inputs.gpu_type }}
      VLLM_URL: ${{ secrets.VLLM_URL }}
      VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: "cosmos-model-eval"
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --group dev
          # MLflow 기록을 위해 mlflow 패키지 추가 설치
          uv pip install mlflow boto3

      - name: 1단계 - AI 팀 평가기 실행 (evals.generate)
        run: |
          LIMIT_OPT=""
          if [ "${{ inputs.limit }}" != "0" ]; then
            LIMIT_OPT="--limit ${{ inputs.limit }}"
          fi

          echo "=================================================="
          echo "평가 1단계 (생성) 시작: 모델=${{ inputs.model_id }}"
          echo "=================================================="

          uv run python -m evals.generate \
            --label "${LABEL}" \
            --model "${{ inputs.model_id }}" \
            --chat-template-kwargs '{"enable_thinking": false}' \
            ${LIMIT_OPT}

      - name: 2단계 - AI 팀 평가기 채점 (evals.score)
        run: |
          echo "=================================================="
          echo "평가 2단계 (채점 및 검증 재생) 시작"
          echo "=================================================="
          uv run python -m evals.score --label "${LABEL}"

      - name: 3단계 - 비교표 산출 (evals.summarize)
        run: |
          echo "=================================================="
          echo "평가 3단계 (비교표 요약) 시작"
          echo "=================================================="
          uv run python -m evals.summarize --label "${LABEL}"

      - name: 4단계 - MLflow 및 S3에 메트릭 기록
        continue-on-error: true
        run: |
          uv run python .github/scripts/log_eval_to_mlflow.py \
            --label "${LABEL}" \
            --track-type "${{ inputs.track_type }}" \
            --model-id "${{ inputs.model_id }}" \
            --prompt-version "${{ inputs.prompt_version }}"

      - name: 평가 결과 아티팩트 보관
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.track_type }}-${{ github.run_id }}
          path: evals/results/${{ env.LABEL }}/

      - name: 디스코드 평가 완료 알림 발송
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"🚀 **[LLMOps 평가 완료]**\n- **유형**: \`${{ inputs.track_type }}\`\n- **모델**: \`${{ inputs.model_id }}\`\n- **프롬프트**: \`${{ inputs.prompt_version }}\`\n- **결과 라벨**: \`${{ env.LABEL }}\`\nGitHub Actions 요약 화면에서 승인 여부를 결정하세요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${DISCORD_WEBHOOK_URL}"

  promote-release:
    name: Promote Approved Model to AWS SSM Parameter Store
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-approval

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: AWS SSM Parameter Store 업데이트
        run: |
          PARAM_NAME="/cosmos/prod/model_version"
          echo "=================================================="
          echo "승인된 모델을 SSM Parameter Store에 등록합니다: ${PARAM_NAME} -> ${{ inputs.model_id }}"
          echo "=================================================="

          aws ssm put-parameter \
            --name "${PARAM_NAME}" \
            --value "${{ inputs.model_id }}" \
            --type "String" \
            --overwrite

          echo "성공적으로 SSM 파라미터가 등록되었습니다. 다음 날 새벽 01:00 배치부터 자동 적용됩니다."

      - name: 디스코드 운영 배포 승격 알림 발송
        if: secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"✅ **[LLMOps 운영 모델 승격 승인]**\n- **승인 모델**: \`${{ inputs.model_id }}\`\n- **적용 파라미터**: \`/cosmos/prod/model_version\`\n다음 새벽 01:00 KST 배치부터 이 모델로 자동 추론됩니다.\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
