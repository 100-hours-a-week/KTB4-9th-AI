name: AI CI

on:
  pull_request:
    branches: [ dev, main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 린트, 타입 검사, 단위 테스트 및 조건부 도커 빌드 테스트
  test-and-validate:
    name: Lint, Test and Conditional Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Run Ruff (Linter)
        run: ruff check .

      - name: Run mypy (Type Checker)
        run: mypy . --ignore-missing-imports || echo "mypy warning (non-blocking)"

      - name: Run Unit Tests
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "테스트 디렉터리가 없어 스킵합니다."
          fi

      - name: Syntax & App Startup Verification
        run: |
          python -m compileall .
          if [ -f main.py ]; then
            python -c "import main; print('FastAPI instance loaded successfully')"
          fi

      # 도커 관련 파일 변경 감지 (Dockerfile, .dockerignore, requirements.txt)
      - name: Check for Docker-related changes
        id: docker-filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker_files:
              - 'Dockerfile'
              - '.dockerignore'
              - 'requirements.txt'

      # PR 검증 시 도커 관련 파일이 바뀌었을 때만 도커 이미지 빌드 테스트 수행
      - name: Docker Build Verification (Test Only)
        if: github.event_name == 'pull_request' && steps.docker-filter.outputs.docker_files == 'true'
        run: |
          echo "도커 관련 파일 변경 감지 -> 도커 이미지 빌드 테스트를 수행합니다."
          docker build -t fastapi-test:${{ github.sha }} .
  
  # 2. 앞선 테스트 통과 시 Docker 이미지 빌드 및 Docker Hub 푸시
  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-validate 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME secret is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is required}"
          : "${DOCKERHUB_REPOSITORY:?DOCKERHUB_REPOSITORY variable is required}"

      - name: Log in to Docker Hub
        run: |
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" |
            docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build AI Docker Image
        run: |
          echo "앞선 모든 테스트 통과 -> 프로덕션 도커 이미지 빌드"
          docker build --pull --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .

      - name: Push to Docker Hub
        run: |
          echo "Docker Hub로 이미지 푸시: ${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout >/dev/null 2>&1 || true