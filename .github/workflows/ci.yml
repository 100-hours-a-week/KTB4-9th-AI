name: AI CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Lint, Test and Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run tests
        run: uv run python -m pytest -q
      - name: Verify app startup and health endpoint
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from src.main import app

          response = TestClient(app).get('/health')
          assert response.status_code == 200, response.text
          assert response.json() == {'status': 'ok'}
          PY
      - name: Verify Docker image builds
        run: docker build --pull -f dockerfile -t ai-test:${{ github.sha }} .

      - name: Export deployment image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker save \
            --output "${RUNNER_TEMP}/ai-image.tar" \
            "ai-test:${{ github.sha }}"

      - name: Upload deployment image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: ai-image-${{ github.sha }}
          path: ${{ runner.temp }}/ai-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-and-push:
    name: Build and Push Docker Image
    needs: test-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Download validated image artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-image-${{ github.sha }}
          path: ${{ runner.temp }}/ai-image

      - name: Validate Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME secret is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is required}"
          : "${DOCKERHUB_REPOSITORY:?DOCKERHUB_REPOSITORY variable is required}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load and push validated image
        run: |
          docker load --input "${RUNNER_TEMP}/ai-image/ai-image.tar"
          docker image inspect "ai-test:${IMAGE_TAG}" >/dev/null
          docker tag "ai-test:${IMAGE_TAG}" "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
